[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atulya-launch"
dynamic = ["version"]
description = "Local-first hosting control panel MVP and Atulya tool launcher"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Atulya Tantra", email = "dev@atulya.launch"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "rich>=12.0",
    "requests>=2.28",
    "passlib>=1.7.4",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    "aiofiles>=24.1",
    "apscheduler>=3.10.0",
]
db = [
    "aiosqlite>=0.20",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
]
ssh = [
    "asyncssh>=2.14.0",
]
auth = [
    "pyotp>=2.9.0",
    "python-jose[cryptography]>=3.3.0",
]
all = [
    "atulya-launch[web,db,ssh,auth]",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/atulyaai/Atulya-Launch"
Issues = "https://github.com/atulyaai/Atulya-Launch/issues"

[project.scripts]
atulya-launch = "atulya_launch.cli:main"

[tool.setuptools.dynamic]
version = {attr = "atulya_launch.__version__"}

[tool.setuptools.packages.find]
include = ["atulya_launch*"]
